name: Release

# Only fires on bare version tags: v0.2.3, v1.0.0, etc. (NOT rc tags).
# Before pushing a production tag, a matching RC tag (v0.2.3-rc.*) must
# have passed the staging workflow. The verify-staged job enforces this.
#
# Release flow:
#   1. Merge version-bump PR to main
#   2. git tag v0.2.3-rc.1 && git push github v0.2.3-rc.1  → staging.yml
#   3. All staging jobs green
#   4. git tag v0.2.3   && git push github v0.2.3            → this workflow
#   5. verify-staged passes → publish-python + publish-npm + publish-host
#      + publish-adapters (matrix) → create-release
#
# Before first publish of a new package, register it as a PyPI Trusted Publisher:
#   https://pypi.org/manage/project/<package-name>/settings/publishing/
#   Repository: capabilityhostprotocol/chp-core  |  Workflow: release.yml  |  Env: release

# Two ways in:
#   • Tag push (v0.2.3) — the full governed release: RC guard → publish
#     chp-core + chp-host to PyPI + ts-types to npm → GitHub release.
#     Adapters are SKIPPED here for now (no trusted publishers yet — they 403).
#   • Manual (workflow_dispatch) — publish a chosen SUBSET to PyPI without a tag.
#     Set `packages` to a space-separated list of: chp-core chp-host ts-types
#     adapters   (or `all`). The RC guard and GitHub-release step do not apply
#     to manual runs; each package publishes at whatever version its manifest
#     declares.
on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-rc.*'  # RC tags → staging.yml only
    branches-ignore:
      - '**'  # tags only — branch pushes do not trigger release
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (space-separated: chp-core chp-host ts-types adapters — or "all")'
        default: 'chp-core chp-host'
        type: string

jobs:
  # ── Guard: a matching RC tag must exist in the repo ──────────────────────
  verify-staged:
    name: Verify RC was staged
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # manual runs have no tag/RC to verify
    steps:
      - name: Check out repository (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm matching RC tag exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # e.g. 0.2.3
          RC_PATTERN="v${VERSION}-rc.*"
          echo "Looking for RC tags matching: $RC_PATTERN"
          MATCHES=$(git tag --list "$RC_PATTERN")
          if [ -z "$MATCHES" ]; then
            echo ""
            echo "ERROR: No RC tag found for v${VERSION}."
            echo "Push a staging tag first:"
            echo "  git tag v${VERSION}-rc.1 && git push github v${VERSION}-rc.1"
            echo "Then wait for staging.yml to pass before pushing the production tag."
            exit 1
          fi
          echo "Found RC tags: $MATCHES"

  # ── Publish Python to PyPI ────────────────────────────────────────────────
  publish-python:
    name: Publish Python package
    runs-on: ubuntu-latest
    needs: [verify-staged]
    # Runs on every tag push; on manual runs only when chp-core is selected.
    # always() so a skipped RC guard (manual path) doesn't skip this job.
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' chp-core ')
      ) }}
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/python

      # The exact bytes built here go to BOTH PyPI and the GitHub release —
      # one build per package, so one provenance statement covers both
      # channels (the 0.10.0 lesson: sign what actually ships).
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-chp-core
          path: packages/python/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true

  # ── Publish chp-host CLI to PyPI ─────────────────────────────────────────
  publish-host:
    name: Publish chp-host
    runs-on: ubuntu-latest
    needs: [verify-staged]
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' chp-host ')
      ) }}
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/chp-host

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-chp-host
          path: packages/chp-host/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/chp-host/dist/
          skip-existing: true

  # ── Publish chp-adapter-* to PyPI (matrix) ───────────────────────────────
  publish-adapters:
    name: Publish ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    needs: [verify-staged, publish-python]
    # Skipped on tag pushes for now (adapters lack trusted publishers → 403).
    # Publish them explicitly via a manual run with `adapters` (or `all`).
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure'
          && needs.publish-python.result != 'failure' && (
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' adapters ')
      ) }}
    environment: release
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - chp-adapter-http
          - chp-adapter-filesystem
          - chp-adapter-git
          - chp-adapter-audit
          - chp-adapter-secrets
          - chp-adapter-jobs
          - chp-adapter-tailscale
          - chp-adapter-mcp
          - chp-adapter-registry
          - chp-adapter-conformance
          - chp-adapter-github
          - chp-adapter-radicle
          - chp-adapter-ci
          - chp-adapter-process
          - chp-adapter-messages
          - chp-adapter-planning
          - chp-adapter-delegation
          - chp-adapter-safety
          - chp-adapter-composition
          - chp-adapter-huggingface
          - chp-adapter-tei
          - chp-adapter-vllm
          - chp-adapter-scout
          - chp-adapter-sglang
          - chp-adapter-smolagents
          - chp-adapter-local-llm
          - chp-adapter-launchd
          - chp-adapter-synology
          - chp-adapter-raspi
          - chp-adapter-release
          - chp-adapter-mlx
          - chp-adapter-host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/${{ matrix.adapter }}

      # Upload BEFORE publish: an adapter whose PyPI project doesn't exist yet
      # still ships on the GitHub release (its only channel until a trusted
      # publisher is registered — see the header note).
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.adapter }}
          path: packages/${{ matrix.adapter }}/dist/

      - name: Publish to PyPI
        # fail-soft: 16 adapter projects have no PyPI trusted publisher yet;
        # their 403s are expected and must not fail the run or skip the release
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.adapter }}/dist/
          skip-existing: true

  # ── Publish TypeScript types to npm ──────────────────────────────────────
  publish-npm:
    name: Publish TypeScript types
    runs-on: ubuntu-latest
    needs: [verify-staged]
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' ts-types ')
      ) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm install (not ci) — tolerant of root-lockfile drift after a workspace
      # version bump (release syncs package.json but not the root lockfile); matches
      # publish-ts-alpha.yml. Prevents the whole "npm ci out of sync" release failure.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: packages/ts-types
        run: npm run build

      - name: Publish to npm
        working-directory: packages/ts-types
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Verify what ACTUALLY reached PyPI ─────────────────────────────────────
  # The publish legs above are deliberately fail-soft (continue-on-error) because
  # adapters without a trusted publisher 403 by design. The cost is that a leg which
  # uploaded NOTHING is indistinguishable from one that worked: v0.50.0 reported the
  # whole matrix green while PyPI still served 0.28.0 for filesystem/http/git/mcp.
  #
  # So: soft on the publish, LOUD on the report. This job asks PyPI what it actually
  # serves and names every package that did not ship. It does not gate create-release
  # — the release record still stands — it just makes the gap impossible to miss.
  verify-published:
    name: Verify PyPI has each targeted package
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs: [publish-python, publish-host, publish-adapters]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compare every targeted package manifest against the PyPI simple index
        env:
          EVENT: ${{ github.event_name }}
          PACKAGES: ${{ inputs.packages }}
        run: |
          # Verify only what THIS run intended to publish, so a deliberate subset
          # (or a tag push that skips adapters) does not report red. Each package
          # is checked against the version its own manifest declares.
          want_core=false; want_host=false; want_adapters=false
          if [ "$EVENT" = "push" ]; then
            want_core=true; want_host=true            # adapters skipped on tag push
          else
            case " $PACKAGES " in *" all "*) want_core=true; want_host=true; want_adapters=true ;; esac
            case " $PACKAGES " in *" chp-core "*) want_core=true ;; esac
            case " $PACKAGES " in *" chp-host "*) want_host=true ;; esac
            case " $PACKAGES " in *" adapters "*) want_adapters=true ;; esac
          fi

          targets=""
          $want_core     && targets="$targets packages/python/pyproject.toml"
          $want_host     && targets="$targets packages/chp-host/pyproject.toml"
          $want_adapters && targets="$targets packages/chp-adapter-*/pyproject.toml"
          echo "Verifying:$targets"
          echo ""

          behind=""
          for pyproject in $targets; do
            [ -f "$pyproject" ] || continue
            name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$pyproject" | head -1)
            want=$(sed -n 's/^version = "\(.*\)"/\1/p' "$pyproject" | head -1)
            [ -n "$name" ] && [ -n "$want" ] || continue
            # Normalise to the simple-index form (PEP 503).
            slug=$(echo "$name" | tr '[:upper:]_.' '[:lower:]--')
            html=$(curl -sf --max-time 20 "https://pypi.org/simple/${slug}/" || echo "")
            if [ -z "$html" ]; then
              echo "  ?  $name — no PyPI project (never published)"
              behind="$behind $name(absent)"
            elif echo "$html" | grep -qF "${want}"; then
              echo "  ok $name $want"
            else
              latest=$(echo "$html" | grep -oE '\-[0-9]+\.[0-9]+\.[0-9]+' | tr -d '-' | sort -V | tail -1)
              echo "  ✗  $name — PyPI serves ${latest:-unknown}, expected $want"
              behind="$behind $name"
            fi
          done
          echo ""
          if [ -n "$behind" ]; then
            {
              echo "## Packages that did NOT publish at their manifest version"
              echo ""
              for p in $behind; do echo "- \`$p\`"; done
              echo ""
              echo "These legs reported success because the PyPI publish step is"
              echo "\`continue-on-error: true\` — a 403 from a missing trusted publisher is"
              echo "swallowed. Register each at:"
              echo ""
              echo "    https://pypi.org/manage/project/<name>/settings/publishing/"
              echo "    Repository: capabilityhostprotocol/chp-core"
              echo "    Workflow:   release.yml"
              echo "    Environment: release"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "FAILED: the following did not reach PyPI at their manifest version:$behind"
            exit 1
          fi
          echo "All targeted packages present on PyPI at their manifest version." >> "$GITHUB_STEP_SUMMARY"

  # ── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # The release is the canonical artifact record — it must exist even when
    # some publish legs fail (their artifacts still attach; PyPI can catch up
    # on a rerun). Only a cancelled run — or a tag-less manual run — skips it.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [publish-python, publish-npm, publish-host, publish-adapters]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for release notes generation

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release-dist/*

      - name: Next step reminder
        run: |
          echo 'Release created with all built artifacts.'
          echo 'Finish operator-side (provenance signing, chp-release key custody):'
          echo '  bash scripts/release-finish.sh <version>   # in chp-dev'
