name: Release

# Only fires on bare version tags: v0.2.3, v1.0.0, etc. (NOT rc tags).
# Before pushing a production tag, a matching RC tag (v0.2.3-rc.*) must
# have passed the staging workflow. The verify-staged job enforces this.
#
# Release flow:
#   1. Merge version-bump PR to main
#   2. git tag v0.2.3-rc.1 && git push github v0.2.3-rc.1  → staging.yml
#   3. All staging jobs green
#   4. git tag v0.2.3   && git push github v0.2.3            → this workflow
#   5. verify-staged passes → publish-python + publish-npm + publish-host
#      + publish-adapters (matrix) → create-release
#
# Before first publish of a new package, register it as a PyPI Trusted Publisher:
#   https://pypi.org/manage/project/<package-name>/settings/publishing/
#   Repository: capabilityhostprotocol/chp-core  |  Workflow: release.yml  |  Env: release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-rc.*'  # RC tags → staging.yml only
    branches-ignore:
      - '**'  # tags only — branch pushes do not trigger release
  # Manual selective publish (no tag): publish a chosen SUBSET to PyPI/npm. Adapters are
  # SKIPPED on tag pushes (no trusted publishers → 403); publish them explicitly here.
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to publish (space-separated: chp-core chp-host ts-types adapters — or "all")'
        default: 'chp-core chp-host'
        type: string

jobs:
  # ── Guard: a matching RC tag must exist in the repo ──────────────────────
  verify-staged:
    name: Verify RC was staged
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # manual runs have no tag/RC to verify
    steps:
      - name: Check out repository (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm matching RC tag exists
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # e.g. 0.2.3
          RC_PATTERN="v${VERSION}-rc.*"
          echo "Looking for RC tags matching: $RC_PATTERN"
          MATCHES=$(git tag --list "$RC_PATTERN")
          if [ -z "$MATCHES" ]; then
            echo ""
            echo "ERROR: No RC tag found for v${VERSION}."
            echo "Push a staging tag first:"
            echo "  git tag v${VERSION}-rc.1 && git push github v${VERSION}-rc.1"
            echo "Then wait for staging.yml to pass before pushing the production tag."
            exit 1
          fi
          echo "Found RC tags: $MATCHES"

  # ── Publish Python to PyPI ────────────────────────────────────────────────
  publish-python:
    name: Publish Python package
    runs-on: ubuntu-latest
    needs: [verify-staged]
    # Every tag push; on a manual run only when chp-core is selected. always() so a
    # skipped RC guard (manual path) doesn't cascade-skip this job.
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' chp-core ')
      ) }}
    environment: release
    permissions:
      id-token: write  # required for PyPI trusted publishing (OIDC)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/python

      # The exact bytes built here go to BOTH PyPI and the GitHub release —
      # one build per package, so one provenance statement covers both
      # channels (the 0.10.0 lesson: sign what actually ships).
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-chp-core
          path: packages/python/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist/
          skip-existing: true

  # ── Publish chp-host CLI to PyPI ─────────────────────────────────────────
  publish-host:
    name: Publish chp-host
    runs-on: ubuntu-latest
    needs: [verify-staged]
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' chp-host ')
      ) }}
    environment: release
    permissions:
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/chp-host

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-chp-host
          path: packages/chp-host/dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/chp-host/dist/
          skip-existing: true

  # ── Publish chp-adapter-* to PyPI (matrix) ───────────────────────────────
  publish-adapters:
    name: Publish ${{ matrix.adapter }}
    runs-on: ubuntu-latest
    needs: [verify-staged, publish-python]
    # SKIPPED on tag pushes — adapters version independently and most lack trusted
    # publishers (→ 403). Publish explicitly via a manual run with `adapters` (or `all`).
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure'
          && needs.publish-python.result != 'failure' && (
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' adapters ')
      ) }}
    environment: release
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        adapter:
          - chp-adapter-http
          - chp-adapter-filesystem
          - chp-adapter-git
          - chp-adapter-audit
          - chp-adapter-secrets
          - chp-adapter-jobs
          - chp-adapter-tailscale
          - chp-adapter-mcp
          - chp-adapter-registry
          - chp-adapter-conformance
          - chp-adapter-github
          - chp-adapter-radicle
          - chp-adapter-ci
          - chp-adapter-process
          - chp-adapter-messages
          - chp-adapter-planning
          - chp-adapter-delegation
          - chp-adapter-safety
          - chp-adapter-composition
          - chp-adapter-huggingface
          - chp-adapter-tei
          - chp-adapter-vllm
          - chp-adapter-scout
          - chp-adapter-sglang
          - chp-adapter-smolagents
          - chp-adapter-local-llm
          - chp-adapter-launchd
          - chp-adapter-synology
          - chp-adapter-raspi
          - chp-adapter-release
          - chp-adapter-mlx
          - chp-adapter-host
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build packages/${{ matrix.adapter }}

      # Upload BEFORE publish: an adapter whose PyPI project doesn't exist yet
      # still ships on the GitHub release (its only channel until a trusted
      # publisher is registered — see the header note).
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.adapter }}
          path: packages/${{ matrix.adapter }}/dist/

      - name: Publish to PyPI
        # fail-soft: 16 adapter projects have no PyPI trusted publisher yet;
        # their 403s are expected and must not fail the run or skip the release
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.adapter }}/dist/
          skip-existing: true

  # ── Publish TypeScript types to npm ──────────────────────────────────────
  publish-npm:
    name: Publish TypeScript types
    runs-on: ubuntu-latest
    needs: [verify-staged]
    if: >-
      ${{ always() && needs.verify-staged.result != 'failure' && (
        github.event_name == 'push' ||
        inputs.packages == 'all' ||
        contains(format(' {0} ', inputs.packages), ' ts-types ')
      ) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm install (not ci) — tolerant of root-lockfile drift after a workspace
      # version bump (release syncs package.json but not the root lockfile); matches
      # publish-ts-alpha.yml. Prevents the whole "npm ci out of sync" release failure.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: packages/ts-types
        run: npm run build

      - name: Publish to npm
        working-directory: packages/ts-types
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Verify the protocol train reached PyPI ────────────────────────────────
  # HARD gate: the protocol-train Python packages (chp-core, chp-host) MUST be on
  # PyPI at the tagged version. Capability adapters (chp-adapter-*) version
  # INDEPENDENTLY and publish on their own cadence (see the versioning model —
  # release-preflight.sh step 4 in chp-dev), so they are NOT expected at the core
  # version; they get an ADVISORY report at THEIR OWN version that never gates the
  # release. This ends the chronic false-fail where 30+ independently-versioned
  # adapters read as "behind" the core tag.
  verify-published:
    name: Verify protocol train on PyPI
    runs-on: ubuntu-latest
    # Tag releases only — a manual subset publish relies on each publish step's own success.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [publish-python, publish-host]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Protocol train must be on PyPI at the tagged version (retry for propagation)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Expecting the protocol train on PyPI at $VERSION."
          missing=""
          for pyproject in packages/python/pyproject.toml packages/chp-host/pyproject.toml; do
            [ -f "$pyproject" ] || continue
            name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$pyproject" | head -1)
            [ -n "$name" ] || continue
            slug=$(echo "$name" | tr '[:upper:]_.' '[:lower:]--')
            # The version-specific release URL is authoritative. The simple index and
            # the JSON "latest" field lag minutes behind a fresh upload — do NOT trust
            # them for a just-published version. Poll with backoff.
            ok=""
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://pypi.org/pypi/${slug}/${VERSION}/json" || echo 000)
              if [ "$code" = "200" ]; then ok=1; echo "  ok  $name $VERSION"; break; fi
              echo "  ..  $name $VERSION not on PyPI yet (HTTP $code) — retry $attempt/10"; sleep 30
            done
            [ -n "$ok" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "FAILED: protocol train missing on PyPI at $VERSION:$missing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Protocol train present on PyPI at $VERSION." >> "$GITHUB_STEP_SUMMARY"

      - name: Advisory — capability-adapter versions on PyPI (never gates)
        if: ${{ always() }}
        run: |
          echo "### Capability adapters — independent versions, advisory only" >> "$GITHUB_STEP_SUMMARY"
          for pyproject in packages/chp-adapter-*/pyproject.toml; do
            [ -f "$pyproject" ] || continue
            name=$(sed -n 's/^name = "\(.*\)"/\1/p' "$pyproject" | head -1)
            ver=$(sed -n 's/^version = "\(.*\)"/\1/p' "$pyproject" | head -1)
            [ -n "$name" ] || continue
            slug=$(echo "$name" | tr '[:upper:]_.' '[:lower:]--')
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://pypi.org/pypi/${slug}/${ver}/json" || echo 000)
            if [ "$code" = "200" ]; then echo "- \`$name\` $ver — on PyPI" >> "$GITHUB_STEP_SUMMARY";
            else echo "- \`$name\` $ver — not on PyPI (private/independent; expected unless a public adapter release)" >> "$GITHUB_STEP_SUMMARY"; fi
          done

  # ── Create GitHub Release ─────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # The release is the canonical artifact record — it must exist even when some publish
    # legs are skipped (adapters on a tag push) or fail (artifacts still attach; PyPI can
    # catch up on a rerun). Only a cancelled or tag-less manual run skips it.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    needs: [publish-python, publish-npm, publish-host, publish-adapters]
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for release notes generation

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: release-dist/*

      - name: Next step reminder
        run: |
          echo 'Release created with all built artifacts.'
          echo 'Finish operator-side (provenance signing, chp-release key custody):'
          echo '  bash scripts/release-finish.sh <version>   # in chp-dev'
