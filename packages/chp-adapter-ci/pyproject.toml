[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chp-adapter-ci"
version = "0.50.0"
description = "CHP adapter for running package test suites as governed evidence-producing invocations"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["chp-core"]
keywords = ["chp", "capability-host-protocol", "ci", "testing", "pytest"]

[project.entry-points."chp.adapters"]
ci = "chp_adapter_ci:CIAdapter"

[tool.hatch.build.targets.wheel]
packages = ["chp_adapter_ci"]

[tool.pytest.ini_options]
asyncio_mode = "strict"

# Apache-2.0 §4(a): recipients of a distribution must receive a copy of the
# License. Included from the repo root so it cannot drift from canonical.
[tool.hatch.build.targets.wheel.force-include]
"../../LICENSE" = "chp_adapter_ci/LICENSE"
"../../NOTICE" = "chp_adapter_ci/NOTICE"
