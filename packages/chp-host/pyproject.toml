[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chp-host"
version = "0.60.2.dev0"
description = "CHP multi-host router, config-driven adapter host server, and portable onboarding wizard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Project Auxo, Inc." }]
keywords = ["chp", "capability-host-protocol", "agents", "governance", "evidence", "mesh", "onboarding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]
# chp-host tracks chp-core's protocol surface (the router signs task bundles and
# resolves per-host keys — APIs introduced in 0.10.0). Bumped in lockstep.
# mcp is an extra (DEC-SRV-005): imported only by `chp-host mcp` (mcp_server.py),
# so a mandatory dep would force MCP onto every attachment consumer (PKG-009).
dependencies = ["chp-core>=0.10.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

# chp-server attachment provider (docs 35/42): loaded only when a chp-server
# config lists it — installed code is not enabled authority.
[project.entry-points."chp_server.ports"]
adapter_host = "chp_host.server_port:AdapterHostPort"
router_gateway = "chp_host.server_port:RouterPort"
mcp_export = "chp_host.server_port:McpExportPort"

[project.urls]
Homepage = "https://github.com/capabilityhostprotocol/chp-core"
Documentation = "https://github.com/capabilityhostprotocol/chp-core/tree/main/docs"
Issues = "https://github.com/capabilityhostprotocol/chp-core/issues"

[project.scripts]
chp-host = "chp_host.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

